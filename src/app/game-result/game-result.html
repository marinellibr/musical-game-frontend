<main class="page-shell"><section class="page-content round-result-content game-result-content"><p class="eyebrow">PARTIDA ENCERRADA</p><h1>Resultado final</h1>@if (rooms.state()?.game; as game) { <app-leaderboard title="PLACAR FINAL" [entries]="game.leaderboard" />@if (rooms.sessionFor(roomCode)?.isHost) { <button class="button button-primary async-button game-restart-button" type="button" [disabled]="restarting()" (click)="restart()">@if (restarting()) { <app-loader compact label="PREPARANDO NOVA PARTIDA..." /> } @else { JOGAR NOVAMENTE }</button> } @else { <p class="waiting-message">Aguardando o host...</p> }<button class="button button-secondary game-home-button" type="button" [disabled]="restarting()" (click)="goHome()">VOLTAR AO INÍCIO</button> } @else { <app-leaderboard title="PLACAR FINAL" [entries]="[]" [loading]="true" /><app-loader compact label="Carregando resultado final..." /> }</section></main>
